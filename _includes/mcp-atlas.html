{% raw %}<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Public+Sans:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
.mca{
 --bg:#f5f6f8;--panel:#ffffff;--ink:#16202c;--mute:#5b6878;--line:#d5dbe3;--accent:#1f6f8b;
 --exp:#7a4fc4;--beta:#b7791f;--stable:#2f855a;--core:#1f5fa8;--dep:#8a94a3;--warn:#b4442f;
 --display:"Archivo",system-ui,sans-serif;--body:"Public Sans",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace;
}
.mca .wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:32px 64px;display:grid;gap:44px}
.mca h1,.mca h2,.mca h3{font-family:var(--display);font-stretch:85%;text-wrap:balance;margin:0;line-height:1.15}
.mca h1{font-size:2.3rem;font-weight:800}
.mca h2{font-size:1.5rem;font-weight:700}
.mca h3{font-size:1.05rem;font-weight:700}
.mca p{margin:0;max-width:68ch}
.mca .mute{color:var(--mute)}
.mca .eyebrow{font:600 .72rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.mca a{color:var(--accent)}
.mca a:focus-visible,.mca button:focus-visible,.mca select:focus-visible,.mca input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mca section{display:grid;gap:16px}
.mca .stats{display:flex;flex-wrap:wrap;gap:10px 28px;font-variant-numeric:tabular-nums}
.mca .stats div{display:grid}
.mca .stats b{font:700 1.6rem var(--display);font-stretch:80%}
.mca .stats span{font-size:.8rem;color:var(--mute)}
.mca .map{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:16px}
@media(max-width:820px){.mca .map{grid-template-columns:1fr}}
.mca .core{background:var(--panel);border:2px solid var(--core);border-radius:6px;padding:16px;display:grid;gap:12px;align-content:start}
.mca .layer{display:grid;gap:4px}
.mca .layer h4{margin:0;font:600 .72rem var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--core)}
.mca .chips{display:flex;flex-wrap:wrap;gap:4px}
.mca .chip{font:400 .78rem var(--mono);border:1px solid var(--line);border-radius:3px;padding:1px 6px;background:var(--bg)}
.mca .chip.dep{text-decoration:line-through;color:var(--dep)}
.mca .board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media(max-width:560px){.mca .board{grid-template-columns:1fr}}
.mca .col{display:grid;gap:8px;align-content:start}
.mca .col>h3{font-size:.9rem;padding-bottom:4px;border-bottom:3px solid var(--c)}
.mca .ext{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:4px;padding:9px 10px;display:grid;gap:3px}
.mca .ext b{font-family:var(--display);font-stretch:85%;font-size:1rem}
.mca .ext .id{font:400 .7rem var(--mono);color:var(--mute);overflow-wrap:anywhere}
.mca .ext .own{font-size:.8rem}
.mca .ext .dest{font:600 .72rem var(--mono);color:var(--c)}
.mca .ext.gap{border-style:dashed}
.mca .pipe{display:grid;gap:8px}
.mca .pipe .row{display:flex;flex-wrap:wrap;gap:8px}
.mca .pill{font:600 .72rem var(--mono);padding:2px 7px;border-radius:10px;color:var(--panel);background:var(--c);white-space:nowrap}
.mca .flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px}
.mca .step{flex:1 1 140px;background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:4px;padding:10px;display:grid;gap:4px;align-content:start;font-size:.85rem}
.mca .step b{font-family:var(--display);font-stretch:85%;font-size:.98rem}
.mca .cmp{overflow-x:auto}
.mca table{border-collapse:collapse;width:100%;font-size:.86rem}
.mca th,.mca td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.mca th{font:600 .72rem var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--mute)}
.mca .controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.mca .controls button{font:600 .8rem var(--body);border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:4px;padding:5px 10px;cursor:pointer}
.mca .controls button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.mca .controls input{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:4px;padding:5px 8px;min-width:0;flex:1 1 180px;max-width:280px}
.mca .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.mca .g{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;display:grid;gap:8px;align-content:start;min-width:0}
.mca .g.mine{border:2px solid var(--accent)}
.mca .g header{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.mca .kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;font-size:.83rem}
.mca .kv dt{color:var(--mute);font:400 .74rem var(--mono);padding-top:2px}
.mca .kv dd{margin:0;overflow-wrap:anywhere}
.mca .g details{font-size:.84rem}
.mca .g summary{cursor:pointer;color:var(--accent);font-weight:600}
.mca .g ul{margin:6px 0 0;padding-left:18px}
.mca .g li{margin-bottom:3px}
.mca .tl{overflow-x:auto}
.mca .tl svg{display:block;min-width:720px}
.mca .tl text{fill:var(--ink);font:11px var(--mono)}
.mca .tl .ax{fill:var(--mute)}
.mca .notes{display:grid;gap:10px;padding:0;margin:0;list-style:none}
.mca .notes li{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:4px;padding:10px 12px;font-size:.9rem;max-width:none}
.mca .src{font-size:.8rem;color:var(--mute)}
.mca{font:15px/1.55 var(--body);color:var(--ink)} .mca h3{font-family:var(--display);font-stretch:85%} .mca .wide{background:var(--bg);border-radius:8px;padding:16px;display:grid;gap:12px;margin:1.5rem 0}
</style>
<script>

const D={"groups": [{"slug": "agents", "kind": "IG", "title": "Agents", "mission": "The Agents Interest Group exists to make interactions with agent-backed systems interoperable over MCP. Today, these systems are typically exposed as ordinary tools or through framework-specific integrations, leaving durable execution, capability discovery, delegation, and multi-turn interaction to ad hoc conventions. The IG evaluates which remaining gaps require protocol support. Based on production use cases and prototypes, the group will recommend how to evolve the protocol, create additional extensions or document how existing MCP primitives should be used consistently.", "leads": [["Facilitator", "Luca Chang", "Amazon Web Services"]], "meetings": [["Working Session", "Weekly", "30 minutes", "Technical discussion, research, and proposal review"]], "discord": "#agents-wg", "repos": ["agents-wg"], "items": [["Agents Extension evaluation and recommendation", "In Progress", ""], ["Two-level agent definition proof of concept", "In Progress", ""]], "changelog": [["2026-08-04", "Initial charter (as the Agents WG)"], ["2026-10-16", "Converted to an Interest Group. Tasks scope moved to the Tasks and Events WG."]], "members": 1, "seps": [], "cal": {"first": "2025-10-28", "last": "2026-11-27", "held": 40, "upcoming": 5, "slot": "Fri 17:00 UTC", "next": "2026-10-30"}, "chartered": "2026-08-04", "sepinfo": []}, {"slug": "auth", "kind": "IG", "title": "Authorization", "mission": "The Authorization Interest Group is the single chartered venue for MCP authorization work. It brings MCP implementers, identity-provider vendors, and security practitioners together to surface real-world authorization problems, decide whether they are worth solving and whether they belong in MCP, and give authors a reliable place to present SEPs, ext-auth drafts, prototypes, and deployment results for cross-topic feedback. The charter defines the scope; discussion and rough consensus happen in one channel and one recurring call, and the work products are drafts and demos rather than new standi", "leads": [["Facilitator", "Aaron Parecki", "Okta"], ["Facilitator", "Darin McAdams", "Amazon"], ["Facilitator", "Paul Carleton", "Anthropic"]], "meetings": [["Auth IG Call", "Every 2 weeks", "45 min", "Agenda-driven: problem pitches, SEP and draft progress, demos, deployment reports"]], "discord": "#auth-ig", "repos": ["ext-auth"], "items": [["`#auth-wg-client-registration`", "Dynamic Client Registration, Client ID Metadata Documents, software statements, pre-registration", "Completed"], ["`#auth-wg-mixup-protection`", "Authorization-server mix-up and token-audience confusion mitigations", "Completed"], ["`#auth-wg-profiles`", "Client Credentials, Enterprise-Managed Authorization, DPoP, Workload Identity Federation extensions", "Completed"], ["`#auth-wg-tool-scopes`", "Per-tool scope advertisement, step-up authorization, client-side scope accumulation", "Active"], ["`#auth-wg-fine-grained-authz`", "Rich Authorization Requests (RFC 9396), structured denials, remediation hints", "Active"], ["`#auth-wg-improve-devx`", "Best-practices guidance and tutorials beyond the normative spec", "Dormant"], ["`#enterprise-managed-auth-ig`", "EMA extension interoperability (IdP, client, authorization server)", "Active"]], "changelog": [["2026-08-17", "Re-charter: single venue and channel for authorization work; agenda-driven calls; SEP feedback in scope; `#auth-wg-*` channels and the Enterprise-Managed Authorization IG folded in"], ["2026-06-02", "Initial charter"]], "members": 0, "seps": ["2643"], "cal": {"first": "2025-10-22", "last": "2026-12-21", "held": 19, "upcoming": 4, "slot": "Mon 18:00 UTC", "next": "2026-11-09"}, "chartered": "2026-06-02", "sepinfo": [[2643, "Open", "SEP-2643: Structured Authorization Denials"]]}, {"slug": "enterprise-managed-authorization", "kind": "IG", "title": "Enterprise-Managed Authorization", "mission": "The Enterprise-Managed Authorization Interest Group provides a venue for identity-provider vendors, MCP client implementers, and MCP server operators to coordinate on real-world adoption of the Enterprise-Managed Authorization extension (`io.modelcontextprotocol/enterprise-managed-authorization`). The extension's ID-JAG flow only delivers value when an enterprise IdP, an MCP client, and an MCP server's authorization server all interoperate end to end \u2014 this group exists to gather deployment experience, surface compatibility gaps between independent implementations, and feed validated problems ", "leads": [["Facilitator", "Paul Carleton", "Anthropic"], ["Facilitator", "Aaron Parecki", "Okta"]], "meetings": [["Interop Call", "Every 2 weeks", "45 min", "Deployment reports, compatibility-matrix review, spec-feedback triage"]], "discord": "#enterprise-managed-auth-ig", "repos": ["conformance", "ext-auth"], "items": [], "changelog": [["2026-08-17", "Folded into the Authorization IG; channel archived"], ["2026-06-16", "Initial charter"]], "members": 0, "seps": [], "cal": null, "chartered": "2026-06-16", "sepinfo": []}, {"slug": "enterprise", "kind": "IG", "title": "Enterprise Interest Group", "mission": "The Enterprise IG identifies and documents the requirements gaps that enterprises encounter when deploying MCP in production. As MCP adoption scales across regulated industries and large organizations, enterprise teams face recurring gaps in areas such as authentication integration, identity propagation, audit and compliance, gateway behavior, scalability and resilience, and configuration management that are not yet addressed at the protocol level. The group brings together enterprise practitioners to capture these gaps as problem statements and structured recommendations, and to channel them ", "leads": [["Facilitator", "Raghu Chandra", "Independent"], ["Facilitator", "Yannj_Fr", "MCPApps Builders"]], "meetings": [["Working Session", "Monthly", "60 min", "Use case discussion, pain point cataloging, cross-group coordination"]], "discord": "", "repos": [], "items": [["Enterprise Pain Points Catalog", "Planned", "Q2 2026"], ["Healthcare & Compliance Use Cases (PHI, BAA)", "Planned", "Q3 2026"], ["Enterprise Auth Requirements (input to Auth WG)", "Planned", "Q3 2026"], ["Gateway Deployment Patterns Document", "Planned", "Q3 2026"]], "changelog": [["2026-04-13", "Initial charter filed"]], "members": 13, "seps": [], "cal": {"first": "2025-10-22", "last": "2026-05-20", "held": 2, "upcoming": 0, "slot": "Wed 16:00 UTC", "next": ""}, "chartered": "2026-04-13", "sepinfo": []}, {"slug": "financial-services", "kind": "IG", "title": "Financial Services", "mission": "The Financial Services Interest Group brings together stakeholders from regulated financial institutions to identify where MCP needs to adapt for compliance, auditability, and risk-controlled deployment. It gathers use cases and requirements from the financial sector, develops and validates domain-specific extensions, and scopes problems with broad applicability into SEPs or Working Groups so that innovations proven in regulated environments can benefit the wider MCP ecosystem.", "leads": [["Facilitator", "Sambhav Kothari", "Bloomberg"], ["Facilitator", "Peder Holdgaard Pedersen", "Saxo Bank"]], "meetings": [["Working Session", "Every 2 weeks", "60 min", "Use-case review, extension and proposal work, SEP scoping"]], "discord": "#financial-services-ig", "repos": [], "items": [["\u2014", "Regulatory audit & attestation: portable, verifiable event/claim models", "Open"], ["\u2014", "Data lineage & citation: provenance, consent metadata, source attribution", "Open"], ["\u2014", "Guardrails & security: verification frameworks and cryptographic attestations", "Open"], ["\u2014", "Policy enforcement: declarative policies for tool usage and data handling", "Open"]], "changelog": [["2026-06-25", "Initial charter"]], "members": 3, "seps": [], "cal": {"first": "2025-10-09", "last": "2026-12-31", "held": 24, "upcoming": 5, "slot": "Thu 16:00 UTC", "next" hints or contracts (joint with Tool Annotations IG)", "Open"]], "changelog": [["2026-06-13", "Initial charter"]], "members": 4, "seps": ["1913", "2809"], "cal": {"first": "2025-10-07", "last": "2026-08-31", "held": 9, "upcoming": 0, "slot": "Mon 17:00 UTC", "next": ""}, "chartered": "2026-06-13", "sepinfo": [[1913, "Open", "SEP-1913: Trust and Sensitivity Annotations"], [2809, "Open", "SEP-2809: Attested Tool-Server Admission (ATSA)"]]}, {"slug": "tool-annotations", "kind": "IG", "title": "Tool Annotations", "mission": "The Tool Annotations Interest Group explores the role of tool annotations in enabling safe, usable agentic systems across the MCP ecosystem. Today, six independent SEPs propose annotation changes, each solving real problems but lacking the coherent, cross-cutting perspective that a dedicated group can bring. The IG gathers use cases from server and client authors, evaluates existing and proposed annotations, and considers the long-term future of the annotation model, including whether runtime annotations, tool response annotations, and other extensions belong in the protocol.", "leads": [["Facilitator", "Sam Morrow", "GitHub"], ["Facilitator", "Robert Reichel", "OpenAI"]], "meetings": [["Discussion", "TBD", "TBD", "Use-case sharing, annotation review, open Q&A"]], "discord": "", "repos": ["experimental-ext-tool-annotations"], "items": [["SEP-1862", "Tool Resolution (preflight checks)", "Draft"], ["SEP-1913", "Trust and Sensitivity Annotations", "Draft"], ["SEP-1984", "Comprehensive Tool Annotations", "Draft"], ["SEP-2417", "Model Preferences for Tools", "Draft"]], "changelog": [["2026-04-20", "Initial charter"]], "members": 9, "seps": ["1862", "1913", "1984", "2417"], "cal": {"first": "2026-04-23", "last": "2026-12-24", "held": 11, "upcoming": 4, "slot": "Thu 15:30 UTC", "next": "2026-11-12"}, "chartered": "2026-04-20", "sepinfo": [[1862, "?", ""], [1913, "Open", "SEP-1913: Trust and Sensitivity Annotations"], [1984, "?", ""], [2417, "?", ""]]}, {"slug": "apps", "kind": "WG", "title": "MCP Apps Working Group", "mission": "The MCP Apps Working Group defines, evolves, and maintains the official extension for interactive user interfaces over MCP. The working group oversees the extension specification, SDK, reference implementations, security model, conformance work, and guidance so that apps can run safely and consistently across independent MCP hosts.", "leads": [["Lead", "Ido Salomon", "MCP-UI"], ["Lead", "Liad Yosef", "MCP-UI / Ora"], ["Lead", "Olivier Chafik", "Anthropic"]], "meetings": [["Working Session", "Tri-weekly (Wednesday, 08:00 Pacific)", "60 minutes", "Specification review, roadmap discussion, and app/host feedback"]], "discord": "#mcp-apps-wg", "repos": ["ext-apps"], "items": [["Specification and SDK evolution: protocol alignment, capability negotiation, versioning, and maintenance of `@modelcontextprotocol/ext-apps`", "In Progress", ""], ["Address view sprawl across tools and servers (reusable and independent views)", "In Progress", ""], ["Formalize security model and extend sandboxing and permissions", "In Progress", ""], ["Experiment with the app tools interaction model (WebMCP approach)", "In Progress", ""], ["Address dynamic resource content and non-HTML hosts", "Draft", ""], ["Conformance and cross-host interoperability: official validator, public platform tests, and compatibility reporting", "In Progress", ""], ["Developer experience and ecosystem adoption: reference host, authoring tools, examples, documentation, accessibility, and discovery coordination", "Maintained", ""]], "changelog": [["2025-11-21", "SEP-1865 proposed, unifying the MCP-UI and OpenAI Apps SDK approaches"], ["2025-12-17", "First MCP Apps Working Group meeting"], ["2026-01-26", "Initial stable MCP Apps extension specification published"], ["2026-01-28", "SEP-1865 marked Final"], ["2026-05-21", "Initial charter"]], "members": 6, "seps": ["1865"], "cal": {"first": "2026-01-07", "last": "2027-02-03", "held": 18, "upcoming": 5, "slot": "Wed 16:00 UTC", "next": "2026-11-04"}, "chartered": "2025-11-21", "sepinfo": [[1865, "Final", "SEP-1865: MCP Apps - Interactive User Interfaces for MCP"]]}, {"slug": "file-uploads", "kind": "WG", "title": "File Uploads", "mission": "The File Uploads Working Group exists to define how MCP tools and elicitation requests declare file inputs so that hosts can present native file pickers and pass user-selected file content to servers. Today, servers that need a file from the user resort to prose instructions asking for base64 strings or local paths, which produces inconsistent UX and pushes encoding details onto end users. This WG will specify a minimal, schema-level mechanism for declaring file inputs and the wire format for delivering them, anchored on SEP-2356. As a secondary goal, the WG covers how a tool returns a file th", "leads": [["Lead", "Den Delimarsky", "Anthropic"]], "meetings": [["Working Session", "Biweekly", "30 min", "Technical discussion, proposal review"]], "discord": "#file-uploads-wg", "repos": [], "items": [["SEP-2356: Declarative file inputs", "Draft", "End May"], ["TypeScript SDK reference implementation", "\u2014", "End May"], ["Reference implementation in a second Tier-1 SDK", "\u2014", "End June"]], "changelog": [["2026-04-23", "Initial charter"], ["2026-10-21", "Add file downloads to scope as a secondary item"]], "members": 3, "seps": ["2356"], "cal": {"first": "2026-09-23", "last": "2026-11-27", "held": 5, "upcoming": 5, "slot": "Fri 16:00 UTC", "next": "2026-10-30"}, "chartered": "2026-04-23", "sepinfo": [[2356, "?", ""]]}, {"slug": "filesystems", "kind": "WG", "title": "Filesystems", "mission": "The Filesystems Working Group exists to align MCP Resources with general filesystem semantics, so that MCP clients have one interface for discovering, retrieving and modifying filesystem-shaped resources across sources, and can do so efficiently. Agent platforms are converging on presenting services to models as filesystems, and Resources function card(g){
 const c=g.cal,mt=(g.meetings[0]||[]);
 const items=g.items.map(i=>`<li>${esc(i[0])}${i[1]?` <span class="mute">· ${esc(i[1])}</span>`:''}</li>`).join('');
 return `<article class="g${g.slug==='agents'?' mine':''}"><header><h3>${esc(g.title)}</h3><span class="pill" style="--c:${g.kind==='WG'?'var(--core)':'var(--exp)'}">${g.kind}</span></header>
 ${g.slug==='agents'?'<span class="eyebrow">Your group · converted from WG on 2026-10-16</span>':''}
 <dl class="kv">
  <dt>leads</dt><dd>${g.leads.map(l=>esc(l[1])+(l[2]?` <span class="mute">(${esc(l[2])})</span>`:'')).join(', ')||'<span style="color:var(--warn)">not listed</span>'}</dd>
  <dt>charter</dt><dd>${esc(mt.slice(0,3).join(' · '))||'—'}</dd>
  <dt>slot</dt><dd>${c?(c.next?`${c.slot} · next ${c.next}`:`last met ${c.last}`):'<span style="color:var(--warn)">not on public calendar</span>'}</dd>
  <dt>held</dt><dd>${c?c.held+' meetings since '+c.first:'—'}</dd>
  <dt>discord</dt><dd>${esc(g.discord)||'—'}</dd>
  <dt>repos</dt><dd>${g.repos.map(r=>`<a href="https://github.com/modelcontextprotocol/${r}" target="_blank" rel="noopener">${r}</a>`).join(', ')||'—'}</dd>
  <dt>SEPs</dt><dd>${g.sepinfo.map(s=>`<span title="${esc(s[2])}">${s[0]} <span class="mute">${s[1]}</span></span>`).join(', ')||'—'}</dd>
  <dt>chartered</dt><dd>${esc(g.chartered)||'—'}${g.members?` · ${g.members} listed members`:''}</dd>
 </dl>
 <details><summary>Mission and work items</summary><p style="margin-top:6px">${esc(g.mission)}</p>${items?`<ul>${items}</ul>`:''}</details>
 <a href="https://github.com/modelcontextprotocol/modelcontextprotocol/blob/main/docs/community/${g.kind==='WG'?'working':'interest'}-groups/${g.slug}.mdx" target="_blank" rel="noopener" style="font-size:.8rem">Charter source</a></article>`;
}
function render(){
 const q=$('#q').value.toLowerCase();
 const gs=D.groups.filter(g=>(F==='all'||g.kind===F)&&(!q||JSON.stringify(g).toLowerCase().includes(q))).sort((a,b)=>a.kind.localeCompare(b.kind)||a.title.localeCompare(b.title));
 $('#groups').innerHTML=gs.map(card).join('')||'<p class="mute">No group matches that filter.</p>';
}
document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{F=b.dataset.f;document.querySelectorAll('[data-f]').forEach(x=>x.setAttribute('aria-pressed',x===b));render()});
$('#q').oninput=render;render();

// timeline
(function(){
 const rows=[...D.groups.filter(g=>g.cal).map(g=>({n:g.title,k:g.kind,...g.cal,ch:1})),...D.uncharted.map(u=>({n:{gateways:'Gateways IG','core-primitives':'Core Primitives WG','fine-grained-auth':'Fine-Grained Auth WG','primitive-grouping':'Primitive Grouping WG/IG','mixup-protection':'Mixup Protection WG','server-identity':'Server Identity WG','tool-scopes':'Tool Scopes WG','conformance-testing':'Conformance Testing WG','auth-devex':'Auth DevEx WG','core-maintainers':'Core Maintainers (public)','auth-wg-2025':'Auth WG (2025)'}[u.slug]||u.slug,k:'?',...u,ch:0}))].sort((a,b)=>a.first.localeCompare(b.first));
 const t0=+new Date('2025-09-01'),t1=+new Date('2027-02-15'),L=200,W=960,R=W-12,rh=19,top=24,H=top+rows.length*rh+8;
 const x=d=>L+(+new Date(d)-t0)/(t1-t0)*(R-L);
 let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Meeting series timeline">`;
 for(const m of ['2025-10-01','2026-01-01','2026-04-01','2026-07-01','2026-10-01','2027-01-01']){s+=`<line x1="${x(m)}" x2="${x(m)}" y1="${top-6}" y2="${H}" stroke="var(--line)"/><text class="ax" x="${x(m)}" y="${top-10}" text-anchor="middle">${m.slice(0,7)}</text>`}
 rows.forEach((r,i)=>{const y=top+i*rh,c=r.k==='WG'?'var(--core)':r.k==='IG'?'var(--exp)':'var(--warn)',w=Math.max(4,x(r.last)-x(r.first));
  s+=`<text x="${L-8}" y="${y+12}" text-anchor="end">${esc(r.n.length>26?r.n.slice(0,25)+'…':r.n)}</text><rect x="${x(r.first)}" y="${y+4}" width="${w}" height="10" rx="2" fill="${r.ch?c:'none'}" stroke="${c}" ${r.ch?'':'stroke-dasharray="3 2"'} opacity="${r.next||!r.ch?1:.55}"><title>${esc(r.n)}: ${r.first} → ${r.last}, ${r.held} held</title></rect><text class="ax" x="${x(r.first)+w+5}" y="${y+12}">${r.held}</text>`});
 s+=`<line x1="${x('2026-10-30')}" x2="${x('2026-10-30')}" y1="${top-6}" y2="${H}" stroke="var(--accent)" stroke-width="2"/></svg>`;
 $('#tl').innerHTML=s;
})();

$('#notes').innerHTML=[
 '<b>Gateways IG has held 41 meetings and has no charter in the repository.</b> It is the third most active series on the calendar and meets weekly, Wed 22:00 UTC. Core Primitives WG (started 2026-10-05) is also running without a charter.',
 '<b>Variants has an experimental repo but no owning group.</b> The extension ground rules require every experimental extension to be associated with a WG or IG.',
 '<b>Several groups have stopped without a recorded retirement.</b> Server Identity (last met 2026-05-11), Mixup Protection (2026-05-20), Fine-Grained Auth (2026-09-09) and Primitive Grouping (2026-08-14) have no meetings scheduled, and none has a charter to archive.',
 '<b>Two chartered IGs are effectively dormant on the calendar.</b> Security IG last met 2026-08-31 and Enterprise IG has 2 calendar meetings in total. Governance WG, Infrastructure WG and Enterprise-Managed Authorization IG have no series on the public calendar, which the rules require.',
 '<b>Agents converted from WG to IG.</b> On 2026-10-16 its Tasks scope and leads moved to the renamed Tasks and Events WG, which now owns both the Beta Tasks extension and the experimental Triggers & Events repo. The Agents IG charter lists one member, its facilitator, and asks one question: whether an Agents Extension is needed beside Tasks.',

 '<b>The extension path is where new protocol surface goes.</b> Of 45 merged SEPs, 4 are Extensions Track. Of 32 open SEP pull requests, at least 8 would land as or alter an extension. The only one marked for promotion to core is Tasks.'
].map(n=>`<li>${n}</li>`).join('');

$('#orgs').innerHTML=D.orgs.filter(o=>!['—','-','Core Maintainer'].includes(o[0])).map(o=>`<tr><td>${esc(o[0])}</td><td style="font-variant-numeric:tabular-nums">${o[1]}</td></tr>`).join('');

</script>
